name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install black flake8 pytest pytest-html pytest-xdist openai pydantic

      - name: Run Black formatter check
        run: black --check .

      - name: Run Flake8 linting
        run: flake8 .

      - name: Run Automation Tests (headless mode)
        id: run_tests
        env:
          BASE_URL: https://saucelabs.com
          BROWSER: chrome
        run: pytest tests/ -v --maxfail=1 --disable-warnings --html=reports/report.html --log-file=test_run.log
        continue-on-error: true

      - name: Run AI Log Triage on Failure
        if: steps.run_tests.outcome == 'failure'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python ci_log_triage.py --log-file test_run.log

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: reports/report.html
